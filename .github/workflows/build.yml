name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    # Service containers (Qdrant, below) only run on Linux-hosted runners —
    # macos-latest silently can't start one.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install backend dependencies
        working-directory: backend
        # --frozen: install exactly what's pinned in uv.lock, never silently
        # re-resolve/drift (predictable, reproducible builds).
        # --no-build + --no-install-project: forbid building THIRD-PARTY deps
        # from a source distribution — wheels only, so a compromised package
        # can't run arbitrary setup.py/build-backend code during install.
        # Verified locally that every third-party dependency here resolves to
        # a wheel under this constraint. Our own first-party code is excluded
        # from this step (an editable install of local code isn't a
        # supply-chain risk) and instead built into a real wheel below, then
        # installed with the same --only-binary flag applied trivially (it's
        # already a wheel, no build needed at install time).
        run: |
          uv sync --extra dev --extra rag --python 3.13 --frozen --no-build --no-install-project
          uv build --out-dir dist
          uv pip install --no-build dist/*.whl --no-deps

      - name: Wait for Qdrant
        # Polled from the runner host, not via a container health-check —
        # Qdrant's image isn't guaranteed to ship curl/wget for docker exec.
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:6333/healthz && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready in time" >&2
          exit 1

      - name: Run backend tests with coverage
        working-directory: backend
        env:
          QDRANT_URL: http://localhost:6333
          JWT_SECRET: ci-only-placeholder-secret-32-bytes-minimum
        run: .venv/bin/pytest --cov=app --cov-report=xml:coverage.xml

      - name: Fix coverage.xml paths for monorepo layout
        working-directory: backend
        # coverage.xml's <source> is written relative to this step's cwd
        # (backend/), e.g. <source>app</source> — but SonarQube resolves
        # report paths relative to the repo root (sonar.sources=backend/app),
        # so without this it silently matches nothing and shows 0% coverage.
        # See docs.sonarsource.com .../python-test-coverage and
        # docs.sonarsource.com .../javascript-typescript-test-coverage (same
        # "monorepo path" issue, described there for the JS side).
        run: sed -i 's|<source>app</source>|<source>backend/app</source>|' coverage.xml

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        # --ignore-scripts: no installed package here relies on install-time
        # scripts on Linux (verified locally — the only package with an
        # install script, fsevents, is macOS-only and never installs on this
        # runner anyway), so lifecycle scripts are disabled to prevent
        # arbitrary code execution from a compromised/malicious dependency.
        run: npm ci --ignore-scripts

      - name: Run frontend tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Fix lcov.info paths for monorepo layout
        working-directory: frontend
        # Same one-directory-short problem as the Python coverage.xml fix
        # above: Vitest writes `SF:src/...` relative to frontend/, but
        # sonar.sources=frontend/src is relative to the repo root.
        run: sed -i 's|^SF:|SF:frontend/|' coverage/lcov.info

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
