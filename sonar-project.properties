sonar.projectKey=HarshOfficial08_RAG
sonar.organization=harshofficial08

# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=RAG
sonar.projectVersion=1.0

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8

# Scan only our own code — node_modules/.venv exist on the CI runner during the
# test step (installed to generate coverage) but were never meant to be
# analyzed. e2e specs are excluded from analysis entirely: they test the
# running app end-to-end and don't map to a meaningful unit-coverage number.
sonar.exclusions=**/node_modules/**,**/.venv/**,**/dist/**,**/*.egg-info/**,**/htmlcov/**,frontend/e2e/**

sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.tsx,frontend/src/**/*.test.ts

# Coverage reports generated by the CI workflow's test step before this scan runs.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
