[project]
name = "securerag-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt>=2.9",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
# Heavier ML/retrieval dependencies, installed once the masking/ingestion/retrieval
# modules (currently stubbed per docs/plan/03-04-05) are implemented — see backend/README.md.
rag = [
    "qdrant-client>=1.12",
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    "sentence-transformers>=3.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx2>=2.9",  # starlette.testclient's preferred transport as of starlette 1.x
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
